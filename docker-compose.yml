services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: icestream-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "internal://0.0.0.0:9092,external://0.0.0.0:19092"
      - --advertise-kafka-addr
      - "internal://redpanda:9092,external://localhost:19092"
    ports:
      - "19092:19092"
      - "19644:9644"
